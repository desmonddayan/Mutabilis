services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mutabilis
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      - db
volumes:
  pgdata: